<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yeni şifre belirle</title><link rel="stylesheet" href="/style.css"><style>.reset-card{width:min(100%,480px);padding:42px;background:#fff;border-radius:18px;box-shadow:0 20px 70px #25243f22}.reset-card h1{font:700 27px Manrope,sans-serif}.reset-card p{font-size:13px;color:#777}.reset-card label{display:block;margin:20px 0 8px;font-size:12px;font-weight:700}.reset-card input{width:100%;height:46px;padding:0 12px;border:1px solid #e7e6ef;border-radius:8px}.reset-card button{width:100%;margin-top:18px}.status{padding:12px;border-radius:8px;background:#fff0f0;color:#a12d38}.status[hidden]{display:none}</style></head><body><main class="page-shell"><section class="reset-card"><a class="brand mobile-brand" style="display:inline-flex" href="/">KAVRIX<span class="brand__dot">.</span></a><h1>Yeni şifre belirle</h1><p>Hesabını korumak için en az 8 karakterli yeni bir şifre seç.</p><p id="status" class="status" role="alert" hidden></p><form action="/reset-password" method="post"><input type="hidden" name="token" id="token"><label for="password">Yeni şifre</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Yeni şifreyi tekrar gir</label><input id="confirm" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required><button class="submit-button" type="submit">Şifremi güncelle</button></form><p><a class="text-link" href="/">Giriş sayfasına dön</a></p></section></main><script>const q=new URLSearchParams(location.search);document.querySelector('#token').value=q.get('token')||'';const errors={password:'Şifre en az 8 karakter olmalıdır.',confirm:'Şifreler eşleşmiyor.',expired:'Bağlantı geçersiz veya süresi dolmuş. Yeni bir bağlantı iste.'};const box=document.querySelector('#status');if(errors[q.get('error')]){box.textContent=errors[q.get('error')];box.hidden=false}document.querySelector('form').addEventListener('submit',e=>{if(document.querySelector('#password').value!==document.querySelector('#confirm').value){e.preventDefault();box.textContent=errors.confirm;box.hidden=false}})</script></body></html>
