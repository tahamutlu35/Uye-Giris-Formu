<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Şifre sıfırlama</title><link rel="stylesheet" href="/style.css"><style>.reset-card{width:min(100%,480px);padding:42px;background:#fff;border-radius:18px;box-shadow:0 20px 70px #25243f22}.reset-card h1{font:700 27px Manrope,sans-serif}.reset-card p{font-size:13px;color:#777}.reset-card label{display:block;margin:23px 0 8px;font-size:12px;font-weight:700}.reset-card input{width:100%;height:46px;padding:0 12px;border:1px solid #e7e6ef;border-radius:8px}.reset-card button{width:100%;margin-top:15px}.status{padding:12px;border-radius:8px;background:#f4f1ff;color:#5143ac}.status[hidden]{display:none}</style></head><body><main class="page-shell"><section class="reset-card"><a class="brand mobile-brand" style="display:inline-flex" href="/">KAVRIX<span class="brand__dot">.</span></a><h1>Şifreni sıfırla</h1><p>E-posta adresini yaz; sana güvenli bir sıfırlama bağlantısı gönderelim.</p><p id="status" class="status" role="status" hidden></p><form action="/forgot-password" method="post"><label for="email">E-posta adresi</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="ornek@email.com"><button class="submit-button" type="submit">Sıfırlama bağlantısı gönder</button></form><p><a class="text-link" href="/">Giriş sayfasına dön</a></p></section></main><script>const q=new URLSearchParams(location.search);const box=document.querySelector('#status');if(q.has('sent')){box.textContent='Eğer bu adres kayıtlıysa, sıfırlama bağlantısı e-posta adresine gönderildi.';box.hidden=false}else if(q.has('error')){box.textContent='E-posta gönderilemedi. Sunucu e-posta ayarlarını kontrol edin.';box.hidden=false}</script></body></html>
