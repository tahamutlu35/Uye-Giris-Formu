services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/uye-giris-formu:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: uyelik
      POSTGRES_USER: uyelik
      POSTGRES_PASSWORD: uyelik_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uyelik -d uyelik"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
